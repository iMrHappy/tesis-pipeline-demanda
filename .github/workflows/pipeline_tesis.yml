name: Pipeline Diario Lima-Chiclayo


on:
  schedule:
    # Principal: 16:17 UTC = 11:17 Lima
    - cron: '17 16 * * *'

    # Respaldo: 21:47 UTC = 16:47 Lima
    - cron: '47 21 * * *'

  workflow_dispatch:
    inputs:
      forzar_captura:
        description: "Forzar captura de redBus aunque hoy ya se haya hecho (GASTA crédito de Apify)"
        type: boolean
        default: false
      offsets:
        description: "Dias a capturar separados por coma (vacio = 0,3). Ej: 2"
        type: string
        default: ""


concurrency:
  group: pipeline-diario
  cancel-in-progress: false


permissions:
  contents: read


jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

      # Permitir que Python encuentre los módulos
      # ubicados en la raíz del repositorio.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Verificar estructura del repositorio
        run: |
          echo "=== DIRECTORIO ACTUAL ==="
          pwd

          echo "=== ARCHIVOS DE LA RAIZ ==="
          ls -la

          echo "=== VERIFICAR LEGACY ==="

          if [ -d legacy ]; then
            echo "Carpeta legacy encontrada"
            find legacy -maxdepth 2 -type f
          else
            echo "::error::No existe la carpeta legacy en la raiz"
            exit 1
          fi

          echo "=== ARCHIVOS VERSIONADOS ==="
          git ls-files legacy/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar importacion de legacy
        run: |
          python -c "import sys; print('Python paths:', sys.path); from legacy.membership import trimf; print('Importacion correcta:', trimf)"

      - name: Guardia - ya se capturo redBus hoy?
        id: guardia
        run: python src/guardia_diaria.py

      # DATO PRINCIPAL: ingesta redBus con reintentos.
      # Solo corre si hoy no se capturó, o si se fuerza a mano con "forzar_captura".
      - name: Ingesta redBus (con reintentos)
        if: steps.guardia.outputs.ya_corrio != 'true' || github.event.inputs.forzar_captura == 'true'
        timeout-minutes: 20
        env:
          OFFSETS: ${{ github.event.inputs.offsets }}
        run: |
          for intento in 1 2 3; do
            if python src/test_apify.py; then
              exit 0
            fi

            echo "::warning::Intento $intento de redBus fallido; reintentando en 120 s"
            sleep 120
          done

          exit 1

      # CLIMA: fuente secundaria. Si se cuelga, se corta a los 3 minutos y el flujo sigue.
      - name: Ingesta clima (secundaria)
        if: steps.guardia.outputs.ya_corrio != 'true' || github.event.inputs.forzar_captura == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: python src/ingest_weather.py

      # TRANSFORMACIONES
      - name: Transformaciones
        if: ${{ !cancelled() }}
        run: |
          python src/transform_weather.py
          python src/transform_staging.py

      # FEATURES DE CALENDARIO
      - name: Actualizar features de calendario
        if: ${{ !cancelled() }}
        run: python src/feature_calendar.py