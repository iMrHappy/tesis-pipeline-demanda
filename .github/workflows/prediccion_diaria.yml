name: Prediccion Diaria

on:
  workflow_run:
    workflows: ["Pipeline Diario Lima-Chiclayo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediccion-diaria
  cancel-in-progress: false

jobs:
  predecir:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-prediccion.txt
      - run: pip install -r requirements-prediccion.txt
      - name: Predecir y recomendar
        run: python src/predict_and_recommend.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Prediccion diaria $(date +%F)"
            git pull --rebase origin main
            git push origin main
          fi